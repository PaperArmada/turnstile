name: decision-record
description: "Structured decision-making process producing an auditable record of context, options, and rationale"
version: "1.1.0"

metadata:
  author: "turnstile"
  tags: ["general-purpose", "governance"]
  principles:
    - render-dont-record
    - portable-by-default
    - single-process-single-document

parameters:
  - name: decision_title
    description: "Short title for the decision (e.g., 'Select auth provider', 'Hire vs contract for Q3')"
    required: true
  - name: output_file
    description: "Path to write the decision record (e.g., docs/decisions/auth-provider.md)"
    required: false
    default: "none"
  - name: domain
    description: "Domain context (e.g., 'architecture', 'hiring', 'vendor selection', 'strategy')"
    required: false
    default: "general"

states:
  - id: start
    type: initial
    transitions: [frame]

  - id: frame
    description: "Define the decision to be made. What is the question? What constraints apply (timeline, budget, technical, regulatory)? Who are the stakeholders? What would happen if no decision were made?"
    transitions: [gather, abandoned]
    on_enter:
      validate:
        - command: "echo 'Domain: ${domain}'"
          expect: not_empty
          message: "Decision domain context"
          severity: info

  - id: gather
    description: "Research the available options. Collect evidence, precedents, and input. Identify at least two viable options; a decision with only one option is a ratification, not a decision."
    transitions: [evaluate, frame, abandoned]

  - id: evaluate
    description: "Assess each option against the constraints and criteria identified during framing. Document trade-offs explicitly: what do you gain and what do you give up with each option?"
    transitions: [decide, gather]
    on_exit:
      validate:
        - command: 'test "${output_file}" = "none" && echo skip || (grep -qi -- option "${output_file}" 2>/dev/null && echo found || echo missing)'
          expect: not_equals("missing")
          message: "Options should be documented before deciding"
          severity: warning

  - id: decide
    description: "Commit to an option. Document the rationale: why this option over the alternatives. Include what would change your mind (reversal conditions)."
    transitions: [communicate, evaluate]
    on_exit:
      validate:
        - command: 'test "${output_file}" = "none" && echo skip || (grep -qiE -- "decision|rationale|chose|selected" "${output_file}" 2>/dev/null && echo found || echo missing)'
          expect: not_equals("missing")
          message: "Decision and rationale should be documented"
          severity: warning

  - id: communicate
    description: "Update relevant artifacts, notify stakeholders, and create follow-up work items if needed. The decision is not complete until the people affected by it know about it."
    transitions: [decided, deferred]

  - id: decided
    type: terminal
    description: "Decision made, documented, and communicated."

  - id: deferred
    type: terminal
    description: "Decision deferred. Conditions not yet met, more information needed, or timing not right."

  - id: abandoned
    type: terminal
    description: "Decision no longer needed (circumstances changed, question became moot)."
