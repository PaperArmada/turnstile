name: peer-review
description: "Structured peer review with role handoff: submit, review, revise, accept"
version: "1.1.0"

metadata:
  author: "turnstile"
  tags: ["general-purpose", "quality"]
  principles:
    - render-dont-record
    - portable-by-default
    - single-process-single-document

parameters:
  - name: artifact
    description: "What is being reviewed (e.g., 'API design doc', 'Q3 budget proposal', 'auth module refactor')"
    required: true
  - name: artifact_path
    description: "Path to the artifact under review (file or directory)"
    required: false
    default: "none"
  - name: domain
    description: "Domain context (e.g., 'engineering', 'legal', 'finance', 'design')"
    required: false
    default: "general"

states:
  - id: start
    type: initial
    transitions: [prepare]

  - id: prepare
    role: submitter
    description: "Prepare the artifact for review. Ensure it is complete, meets submission criteria, and is ready for another party to evaluate."
    agent_context:
      guidance: |
        You are preparing an artifact for peer review.
        Ensure the artifact is complete and ready for evaluation.
        Consider: is the scope clear? Are dependencies documented?
        Is there enough context for a reviewer unfamiliar with the work?
    transitions: [awaiting_review, abandoned]
    on_exit:
      validate:
        - command: 'test "${artifact_path}" = "none" && echo skip || (test -e "${artifact_path}" && echo exists || echo missing)'
          expect: not_equals("missing")
          message: "Artifact must exist if a path was specified"
          severity: warning

  - id: awaiting_review
    type: wait
    role: reviewer
    description: "Artifact submitted for review. Waiting for reviewer to evaluate and provide feedback."
    agent_context:
      guidance: |
        You are reviewing an artifact submitted by another party.
        Evaluate it against the standards of the domain.
        Provide specific, actionable feedback.
        Decide: accept as-is, or request changes with clear guidance.
    signal:
      name: review_decision
      required_fields:
        - key: decision
          description: "Either 'accepted' or 'changes_requested'"
        - key: feedback
          description: "Reviewer comments and feedback"
    transitions: [accepted, revise]

  - id: revise
    role: submitter
    description: "Address reviewer feedback. Make the requested changes, then resubmit."
    agent_context:
      guidance: |
        The reviewer has requested changes.
        Review the feedback carefully and address each point.
        When ready, resubmit for another round of review.
    transitions: [awaiting_review, abandoned]

  - id: accepted
    type: terminal
    description: "Artifact accepted by reviewer."

  - id: abandoned
    type: terminal
    description: "Review abandoned (artifact withdrawn, no longer needed, or blocked)."
