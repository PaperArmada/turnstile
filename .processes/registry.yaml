version: '1.0'
local:
- feature-development
- create-process
- readme-update
- bug-fix
- code-review
- release
- spike
- scientific-method
- decision-record
- peer-review
- security-review
- turnstile-feedback
settings:
  state_dir: .process-state
  require_override_reason: true
  log_retention_days: 90
  enforcement: monitor
  notifications:
    # ${var} references are expanded by the shell from environment variables
    # (name, instance_id, state, step, user, reason). Use double quotes so the
    # shell expands them; single quotes would emit the literal text.
    on_complete: 'echo "[COMPLETE] ${name} (${instance_id}) finished at ${state}" >> .process-state/log.txt'
    on_override: 'echo "[OVERRIDE] ${name} (${instance_id}): ${step} skipped by ${user} - ${reason}" >> .process-state/log.txt'
