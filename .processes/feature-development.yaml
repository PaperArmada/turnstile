name: feature-development
description: "Standard feature development workflow"
version: "1.4.2"

metadata:
  author: "matt"
  tags: ["starter-pack", "development"]
  principles:
    - progressive-disclosure
    - render-dont-record
    - single-process-single-document

parameters:
  - name: feature_name
    description: "Short name for the feature"
    required: true
  - name: issue_id
    description: "Issue tracker ID (e.g., GitHub issue number)"
    required: false
    default: "none"
  - name: test_command
    description: "Command to run the test suite, in POSIX sh syntax: gates run it with eval under /bin/sh, so an environment prefix (FOO=1 pytest), quotes, and pipes work, but bash-only syntax such as 'source' does not (use '. .venv/bin/activate'). The default assumes pytest is on PATH in the gate's environment; pass your project's real invocation (e.g. 'uv run --group dev python -m pytest tests/') to avoid resolving a stray global pytest"
    required: false
    default: "pytest"

states:
  - id: start
    type: initial
    transitions: [understand]

  - id: understand
    description: "Survey the codebase and relevant context before writing code"
    permissions:
      edit: false
    transitions: [implement, abandoned]
    on_enter:
      validate:
        # Progressive disclosure: surface just enough context to plan the work
        # Double quotes: the shell must expand ${issue_id} (values arrive
        # as env vars; single quotes would test the literal string)
        - command: 'test "${issue_id}" != "none" && echo "linked to ${issue_id}" || echo "no issue linked (consider passing issue_id)"'
          expect: not_empty
          message: "Issue linkage check"
          severity: info

        # eval: test_command is a shell command by contract, so the shell must
        # parse it (env prefixes, quotes, pipes). Never eval a data parameter.
        - command: "eval \"${test_command}\" 2>&1 | tail -1 || echo 'no test output'"
          expect: not_empty
          message: "Current test suite status (baseline before changes)"
          severity: info

        - command: "git status --short | head -20"
          expect: empty
          message: "Working tree should be clean before starting"
          severity: warning

  - id: implement
    description: "Write the feature code"
    transitions: [test, understand, abandoned]

  - id: test
    description: "Write and run tests verifying the changes"
    transitions: [review, implement]
    on_enter:
      validate:
        # Render don't record: query git for what actually changed
        - command: "git diff --stat HEAD 2>/dev/null | tail -1 || echo 'no changes'"
          expect: not_empty
          message: "Changes since last commit"
          severity: info

    on_exit:
      validate:
        # Hard gate: tests must pass
        # eval: test_command is a shell command by contract, so the shell must
        # parse it (env prefixes, quotes, pipes). Never eval a data parameter.
        # Gate on the suite's own exit status (a red summary such as
        # "1 failed, 3 passed" contains "passed"); print its last line.
        - command: "out=$(eval \"${test_command}\" 2>&1); status=$?; printf '%s\\n' \"$out\" | tail -1; exit $status"
          expect: exit_code(0)
          message: "Test suite must pass"

        # Check no test regressions
        - command: "eval \"${test_command}\" 2>&1 | tail -1 | grep -oP '\\d+(?= passed)'"
          expect: not_empty
          message: "Test count (verify no regressions)"
          severity: info

  - id: review
    description: "Review the changes before finalizing"
    permissions:
      edit: false
    transitions: [done, implement]
    on_enter:
      validate:
        # Render don't record: check what actually changed
        - command: "git diff --name-only 2>/dev/null | wc -l | tr -d ' '"
          expect: greater_than(0)
          message: "Must have uncommitted changes to review"
          severity: warning

        - command: "git diff --stat 2>/dev/null"
          expect: not_empty
          message: "Summary of changes"
          severity: info

  - id: done
    type: terminal

  - id: abandoned
    type: terminal
    description: "Feature abandoned (not worth pursuing, or superseded)"
