name: bug-fix
description: "Structured bug fix workflow: reproduce, diagnose, fix, verify"
version: "1.3.0"

metadata:
  author: "turnstile"
  tags: ["starter-pack", "development"]
  principles:
    - progressive-disclosure
    - render-dont-record
    - single-process-single-document

parameters:
  - name: bug_summary
    description: "Short description of the bug"
    required: true
  - name: issue_id
    description: "Issue tracker ID"
    required: false
    default: "none"
  - name: test_command
    description: "Command to run the test suite. The default assumes pytest is on PATH in the gate's environment; pass your project's real invocation (e.g. 'uv run --group dev python -m pytest tests/') to avoid resolving a stray global pytest"
    required: false
    default: "pytest"

states:
  - id: start
    type: initial
    transitions: [reproduce]

  - id: reproduce
    description: "Confirm the bug is reproducible before attempting a fix (writing a failing repro test here is encouraged)"
    transitions: [diagnose, abandoned]
    on_enter:
      validate:
        - command: "git log --oneline -5 2>/dev/null || echo 'not a git repo'"
          expect: not_empty
          message: "Recent commits (context for when the bug may have been introduced)"
          severity: info

        - command: "git status --short | head -20"
          expect: empty
          message: "Uncommitted changes present (expected on loop-backs if your repro test is in progress)"
          severity: warning

  - id: diagnose
    description: "Understand the root cause before writing a fix"
    permissions:
      edit: false
    transitions: [fix, reproduce, abandoned]
    on_enter:
      validate:
        - command: "git diff --stat HEAD 2>/dev/null | tail -1 || echo 'no changes'"
          expect: not_empty
          message: "Files changed so far (investigation artifacts)"
          severity: info

  - id: fix
    description: "Write the fix and any regression tests"
    transitions: [verify, diagnose]

  - id: verify
    description: "Confirm the fix resolves the bug and doesn't introduce regressions"
    permissions:
      edit: false
    transitions: [done, fix]
    on_enter:
      validate:
        - command: "git diff --name-only 2>/dev/null | wc -l | tr -d ' '"
          expect: greater_than(0)
          message: "Must have changes to verify"
          severity: warning

        - command: "git diff --stat 2>/dev/null"
          expect: not_empty
          message: "Summary of changes"
          severity: info

    on_exit:
      validate:
        - command: "${test_command} 2>&1 | tail -1"
          expect: contains("passed")
          message: "Test suite must pass"

        - command: "${test_command} 2>&1 | tail -1 | grep -oP '\\d+(?= passed)'"
          expect: not_empty
          message: "Test count (verify no regressions)"
          severity: info

  - id: done
    type: terminal

  - id: abandoned
    type: terminal
    description: "Bug abandoned (not reproducible, already fixed, or not worth pursuing)"
