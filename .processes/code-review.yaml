name: code-review
description: "Structured review of a changeset or pull request"
version: "1.1.1"

metadata:
  author: "turnstile"
  tags: ["starter-pack", "development"]
  principles:
    - progressive-disclosure
    - render-dont-record
    - single-process-single-document

parameters:
  - name: branch
    description: "Branch or PR to review"
    required: true
  - name: base_branch
    description: "Base branch to compare against"
    required: false
    default: "main"

states:
  - id: start
    type: initial
    transitions: [survey]

  - id: survey
    description: "Understand the scope and context of the changes"
    permissions:
      edit: false
    transitions: [review]
    on_enter:
      validate:
        - command: "git log --oneline ${base_branch}..${branch} 2>/dev/null || echo 'branch not found'"
          expect: not_empty
          message: "Commits in this changeset"
          severity: info

        - command: "out=$(git diff --stat ${base_branch}...${branch} 2>&1) || { printf '%s\\n' \"$out\" | head -1; exit 1; }; printf '%s\\n' \"${out:-no diff available}\" | tail -1"
          expect: exit_code(0)
          message: "Change summary (files changed, insertions, deletions)"
          severity: info

        - command: "git diff --name-only ${base_branch}...${branch} 2>/dev/null | head -30"
          expect: not_empty
          message: "Files changed"
          severity: info

  - id: review
    description: "Read the code, check for issues, and note findings"
    permissions:
      edit: false
    transitions: [request_changes, approve, survey]

  - id: request_changes
    description: "Changes are needed before this can be merged"
    permissions:
      edit: false
    transitions: [review]
    on_enter:
      validate:
        - command: "out=$(git diff --stat ${base_branch}...${branch} 2>&1) || { printf '%s\\n' \"$out\" | head -1; exit 1; }; printf '%s\\n' \"${out:-no diff}\" | tail -1"
          expect: exit_code(0)
          message: "Current state of changes (has author addressed feedback?)"
          severity: info

  - id: approve
    type: terminal
    description: "Changes look good, ready to merge"
